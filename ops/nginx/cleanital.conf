server {
  listen 80;
  server_name cleanital.com www.cleanital.com;
  return 301 https://cleanital.com$request_uri;
}
server {
  listen 443 ssl http2;
  server_name cleanital.com;
  # TLS certificate paths are managed on the server and never committed here.
  ssl_certificate /etc/letsencrypt/live/cleanital.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cleanital.com/privkey.pem;
  client_max_body_size 128k;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location / {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
server {
  listen 443 ssl http2;
  server_name www.cleanital.com;
  ssl_certificate /etc/letsencrypt/live/cleanital.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cleanital.com/privkey.pem;
  return 301 https://cleanital.com$request_uri;
}
