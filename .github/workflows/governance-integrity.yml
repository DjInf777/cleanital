name: Governance Integrity

on:
  pull_request:
    paths:
      - "docs/website-governance/**"
      - "scripts/validate_governance.py"
      - ".github/workflows/governance-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "docs/website-governance/**"
      - "scripts/validate_governance.py"
      - ".github/workflows/governance-integrity.yml"

permissions:
  contents: read

jobs:
  governance-integrity:
    name: governance-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate governance corpus
        run: python scripts/validate_governance.py
